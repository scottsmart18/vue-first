<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.5.21/dist/vue.min.js"></script>
</head>
<body>
<div id="app">
    <ul>
        <!-- 有点类似自定义标签 -->
        <my-component-li></my-component-li>
    </ul>
</div>
<div id="app2">
    <ul>
        <my-component-li v-for="item in items" v-bind:david="item">
        </my-component-li>
    </ul>
</div>
<script>
    // 先注册组件
    Vue.component('my-component-li', {
        template: '<li>Hello li</li>'
    });
    // 再实例化 Vue
    var vm = new Vue({
        el: '#app'
    });
</script>
<script>
    // 先注册组件
    Vue.component('my-component-li', {
        props: ['david'],
        template: '<li>Hello {{david}}</li>'
    });
    // 再实例化 Vue
    var vm = new Vue({
        el: '#app2',
        data: {
            items: ["张三", "李四", "王五"]
        }
    });
</script>
</body>
</html>
